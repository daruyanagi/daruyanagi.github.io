name: GitHub Pages

on:
  push:
    branches:
      - main  # Set a branch name to trigger deployment
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.151.2'
          extended: true

      - name: Fetch XTimelineViewer README
        run: |
          python3 - << 'EOF'
          import os
          import re
          import urllib.request

          repo_raw = "https://raw.githubusercontent.com/daruyanagi/XTimelineViewer/main/"
          dest_dir = "content/apps/xtimelineviewer"

          url = repo_raw + "README.md"
          with urllib.request.urlopen(url) as f:
              content = f.read().decode("utf-8")

          lines = content.split("\n")
          title = "XTimelineViewer"
          body_start = 0
          for i, line in enumerate(lines):
              if line.startswith("# "):
                  title = line[2:].strip()
                  body_start = i + 1
                  break

          body = "\n".join(lines[body_start:]).lstrip("\n")

          front_matter = f'---\ntitle: "{title}"\n---\n\n'

          os.makedirs(dest_dir, exist_ok=True)
          with open(os.path.join(dest_dir, "index.md"), "w", encoding="utf-8") as f:
              f.write(front_matter + body)

          print(f"Generated: {title}")

          # README が参照する画像も同じリポジトリから取得して page bundle に配置する。
          # ![alt](path) と <img src="path"> の相対パスが対象（http(s) は除外）。
          refs = re.findall(r'!\[[^\]]*\]\(([^)]+)\)', body)
          refs += re.findall(r'<img[^>]+src=["\']([^"\']+)["\']', body)

          seen = set()
          for ref in refs:
              path = ref.split()[0].split("#")[0].strip()
              if not path or path.startswith(("http://", "https://", "data:", "/")):
                  continue
              if path in seen:
                  continue
              seen.add(path)
              dest = os.path.join(dest_dir, path)
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              try:
                  urllib.request.urlretrieve(repo_raw + path, dest)
                  print(f"Fetched image: {path}")
              except Exception as e:
                  print(f"Skip image {path}: {e}")
          EOF

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: daruyanagi.jp

