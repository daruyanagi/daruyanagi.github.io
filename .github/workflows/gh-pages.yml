name: GitHub Pages

on:
  push:
    branches:
      - main  # Set a branch name to trigger deployment
  pull_request:

jobs:
  deploy:
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.151.2'
          extended: true

      # content/apps/<slug>/index.md は各アプリの GitHub README からビルド時に自動生成する。
      # README が参照する相対パスの画像も同リポジトリから取得して page bundle に配置するので、
      # website リポジトリ側に画像を手動でコミットする必要はない（docs/ 配下も含めて自動で揃う）。
      # 新しいアプリを追加するときは、下の APPS リストに {slug, repo} を足すだけでよい。
      - name: Generate app pages from GitHub READMEs
        run: |
          python3 - << 'EOF'
          import os
          import re
          import urllib.request

          APPS = [
              {"slug": "xtimelineviewer", "repo": "daruyanagi/XTimelineViewer"},
              {"slug": "petapeta", "repo": "daruyanagi/Petapeta"},
          ]

          for app in APPS:
              slug, repo = app["slug"], app["repo"]
              repo_raw = f"https://raw.githubusercontent.com/{repo}/main/"
              dest_dir = f"content/apps/{slug}"

              with urllib.request.urlopen(repo_raw + "README.md") as f:
                  content = f.read().decode("utf-8")

              # 最初の「# 見出し」をタイトルとして取り出し、その行だけを本文から取り除く。
              # （見出しが <div> などで囲まれてインデントされていても拾えるよう strip して判定）
              lines = content.split("\n")
              title = slug
              for i, line in enumerate(lines):
                  if line.strip().startswith("# "):
                      title = line.strip()[2:].strip()
                      del lines[i]
                      break
              body = "\n".join(lines).lstrip("\n")

              front_matter = f'---\ntitle: "{title}"\n---\n\n'
              os.makedirs(dest_dir, exist_ok=True)
              with open(os.path.join(dest_dir, "index.md"), "w", encoding="utf-8") as f:
                  f.write(front_matter + body)
              print(f"[{slug}] Generated: {title}")

              # README が参照する画像も同じリポジトリから取得して page bundle に配置する。
              # ![alt](path) と <img src="path"> の相対パスが対象（http(s)・data: は除外）。
              refs = re.findall(r'!\[[^\]]*\]\(([^)]+)\)', body)
              refs += re.findall(r'<img[^>]+src=["\']([^"\']+)["\']', body)

              seen = set()
              for ref in refs:
                  path = ref.split()[0].split("#")[0].strip()
                  if not path or path.startswith(("http://", "https://", "data:", "/")):
                      continue
                  if path in seen:
                      continue
                  seen.add(path)
                  dest = os.path.join(dest_dir, path)
                  os.makedirs(os.path.dirname(dest), exist_ok=True)
                  try:
                      urllib.request.urlretrieve(repo_raw + path, dest)
                      print(f"[{slug}] Fetched image: {path}")
                  except Exception as e:
                      print(f"[{slug}] Skip image {path}: {e}")
          EOF

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        if: ${{ github.ref == 'refs/heads/main' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: daruyanagi.jp

